name: build

# Every push to main that changes the app builds all three packages and
# publishes them as a new GitHub Release. The installer and the app's own
# update check both read "the latest release", so shipping is just merging.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

# One release at a time, so two quick merges cannot pick the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Picks the version to publish. Releases are numbered by this job, not by
  # hand: the next patch after the latest release. To ship a bigger step,
  # raise `version:` in pubspec.yaml past the latest release (for example to
  # 0.2.0) and merge; that exact version is used once.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: next
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' pubspec.yaml)"
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)"
          latest="${latest#v}"
          top="$(printf '%s\n%s\n' "$base" "${latest:-0.0.0}" | sort -V | tail -1)"
          if [ "$top" = "$base" ] && [ "$base" != "$latest" ]; then
            next="$base"
          else
            IFS=. read -r major minor patch <<<"$top"
            next="$major.$minor.$((patch + 1))"
          fi
          if ! [[ "$next" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not work out the next version (base='$base', latest='$latest')"
            exit 1
          fi
          echo "pubspec version: $base, latest release: ${latest:-none}, publishing: $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows }
          - { os: macos-latest, name: macos }
          # An older Ubuntu, so the package runs on more distributions: a
          # binary needs a glibc at least as new as the one it was built with.
          - { os: ubuntu-22.04, name: linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The app shows this number and compares it with the latest release to
      # decide whether an update exists, so it must be the version published.
      - name: Stamp the version
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          perl -pi -e "s/^version: .*/version: $VERSION+${GITHUB_RUN_NUMBER}/" pubspec.yaml
          perl -pi -e "s/(static const version = ')[^']*(')/\${1}$VERSION\${2}/" lib/config/app_constants.dart
          grep -n '^version:' pubspec.yaml
          grep -n 'static const version' lib/config/app_constants.dart
          grep -q "static const version = '$VERSION'" lib/config/app_constants.dart
      - uses: subosito/flutter-action@v2
        # Pinned to the version the project is developed and checked on.
        with: { channel: stable, flutter-version: 3.47.9 }
      - name: Linux deps
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libx11-dev libxi-dev libayatana-appindicator3-dev libnotify-dev
      - run: flutter pub get
      - name: Analyze
        if: matrix.name == 'linux'
        run: flutter analyze
      - run: flutter test
      - name: Bridge tests
        shell: bash
        run: cd bridge && dart pub get && dart test
      - name: Compile bridge
        shell: bash
        run: |
          cd bridge && dart pub get
          dart compile exe bin/usage_bridge.dart -o usage_bridge${{ matrix.name == 'windows' && '.exe' || '' }}

      - name: Build + package (windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          flutter build windows --release
          Copy-Item bridge/usage_bridge.exe build/windows/x64/runner/Release/
          Compress-Archive build/windows/x64/runner/Release/* claude-usage-widget-windows.zip

      - name: Build + package (macos)
        if: matrix.name == 'macos'
        run: |
          flutter build macos --release
          APP=build/macos/Build/Products/Release/claude_usage_widget.app
          cp bridge/usage_bridge "$APP/Contents/MacOS/"
          codesign --force --deep --sign - "$APP"
          hdiutil create -volname "Claude Usage Widget" -srcfolder "$APP" -ov -format UDZO claude-usage-widget-macos.dmg

      - name: Build + package (linux)
        if: matrix.name == 'linux'
        run: |
          flutter build linux --release
          cp bridge/usage_bridge build/linux/x64/release/bundle/
          cp install_linux.sh build/linux/x64/release/bundle/
          mkdir -p build/linux/x64/release/bundle/assets && cp assets/icon.png build/linux/x64/release/bundle/assets/
          tar -C build/linux/x64/release/bundle -czf claude-usage-widget-linux.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: claude-usage-widget-*

  # Publishes the three packages as a GitHub Release, tagged with the version
  # picked above. Asset names carry no version so
  # releases/latest/download/<name> always points at the newest one; install.sh
  # relies on that. The tag is created by this release, so nothing has to be
  # committed back to main and no second workflow run is triggered.
  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Checksums
        run: cd dist && sha256sum claude-usage-widget-* > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes
