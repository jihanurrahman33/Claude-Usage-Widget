name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    # The release package is built on this Ubuntu, so check on it too: a newer
    # one has newer system libraries and hides what an older one lacks.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        # Pinned to the version the project is developed and checked on.
        with: { channel: stable, flutter-version: 3.50.0 }
      # The tray plugin compiles native code, even for tests.
      - name: Linux packages
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libx11-dev libxi-dev libayatana-appindicator3-dev libnotify-dev
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Bridge
        run: cd bridge && dart pub get && dart analyze && dart test
      # Compiles the native runner, which analyze and the tests never touch.
      - name: Linux build
        run: flutter build linux --debug

  # Releases are built on Windows too, and some failures only show there
  # (path separators, executable names). Catch them before merging.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.50.0 }
      - run: flutter pub get
      - run: flutter test
      - name: Bridge tests
        shell: bash
        run: cd bridge && dart pub get && dart test
